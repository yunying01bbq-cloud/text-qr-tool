<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>扫码文本</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#f3f7fd;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{width:min(680px,100%);padding:24px;border-radius:22px;background:#fff;box-shadow:0 18px 60px #294a7520} h1{margin:0 0 16px;font-size:27px}
    pre{margin:0;min-height:180px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #dfe6f0;border-radius:14px;background:#f9fbfe;font:17px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;user-select:text}
    .line-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px} button,a.save{height:50px;border:0;border-radius:13px;font-size:16px;font-weight:650;display:grid;place-items:center;text-decoration:none} button{color:#fff;background:#1677ff}.secondary,.line-copy{color:#24518c;background:#edf4ff}.line-copy{font-size:14px}.line-copy:disabled{opacity:.4} p{margin:14px 0 0;text-align:center;color:#718096;font-size:13px}
    @media(max-width:460px){.line-actions{grid-template-columns:1fr}.line-copy{height:44px}}
  </style>
</head>
<body>
  <main><h1>文本内容</h1><pre id="content"></pre><div class="line-actions"><button class="line-copy" data-line="0">复制第一行</button><button class="line-copy" data-line="1">复制第二行</button><button class="line-copy" data-line="2">复制第三行</button></div><div class="actions"><button id="copy">复制全部</button><button id="share" class="secondary">分享/存备忘录</button><a id="save" class="save secondary" download="二维码文本.txt">下载 TXT</a><button id="close" class="secondary">关闭页面</button></div><p>也可以长按上方文字选择复制。</p></main>
  <script>
    const encoded = location.hash.slice(1).replaceAll('-', '+').replaceAll('_', '/');
    let value = '';
    try {
      const binary = atob(encoded + '='.repeat((4 - encoded.length % 4) % 4));
      value = new TextDecoder().decode(Uint8Array.from(binary, c => c.charCodeAt(0)));
    } catch (_) { value = '二维码内容无法读取'; }
    document.querySelector('#content').textContent = value;
    const lines = value.split(/\r?\n/);
    document.querySelectorAll('.line-copy').forEach((button, index) => {
      button.disabled = index >= lines.length;
      button.onclick = async function () {
        await navigator.clipboard.writeText(lines[index]);
        const original = this.textContent;
        this.textContent = `已复制第${['一','二','三'][index]}行`;
        setTimeout(() => this.textContent = original, 1400);
      };
    });
    document.querySelector('#copy').onclick = async function () {
      await navigator.clipboard.writeText(value); this.textContent = '已复制';
      setTimeout(() => this.textContent = '复制全部', 1400);
    };
    document.querySelector('#share').onclick = async function () {
      if (navigator.share) await navigator.share({ title: '二维码文本', text: value });
      else { await navigator.clipboard.writeText(value); this.textContent = '已复制，请粘贴保存'; }
    };
    document.querySelector('#save').href = URL.createObjectURL(new Blob([value], { type: 'text/plain;charset=utf-8' }));
    document.querySelector('#close').onclick = () => window.close();
  </script>
</body>
</html>
