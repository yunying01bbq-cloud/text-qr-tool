<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码工具箱</title>
<style>
:root{color-scheme:light;--blue:#1769e0;--blue2:#0e53bb;--ink:#152033;--muted:#667085;--line:#d9e1ec;--danger:#c92a2a;--success:#18794e}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 10% 8%,#dceaff 0,transparent 32%),radial-gradient(circle at 90% 88%,#e5defe 0,transparent 30%),#f6f8fc}.app{width:min(960px,100%);padding:26px;border:1px solid #ffffffee;border-radius:26px;background:#fffffff0;box-shadow:0 24px 70px #2a406424;backdrop-filter:blur(16px)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}h1{margin:0 0 6px;font-size:clamp(27px,4vw,40px);letter-spacing:-.04em}.lead{margin:0;color:var(--muted)}.tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:#edf2f8}.tab{min-height:42px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:#526277;font-weight:750;white-space:nowrap}.tab.active{color:#fff;background:var(--blue);box-shadow:0 5px 14px #1769e033}.tool[hidden]{display:none}.tool-title{margin:0 0 20px;padding:14px 16px;border-radius:13px;background:#f3f7fd;color:#40516a;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}label{display:block;margin-bottom:9px;font-weight:700}textarea{width:100%;min-height:290px;resize:vertical;padding:16px;border:1px solid var(--line);border-radius:15px;outline:0;color:var(--ink);background:#fff;font:15px/1.65 inherit;transition:.18s}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #1769e01c}.proxy-input{min-height:220px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}.meta{display:flex;justify-content:space-between;gap:10px;min-height:22px;margin-top:8px;color:var(--muted);font-size:13px}.status.error{color:var(--danger)}.status.success{color:var(--success)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{min-height:44px;border:0;border-radius:12px;padding:0 16px;cursor:pointer;font:650 15px inherit;transition:transform .12s,opacity .18s,background .18s}button:active{transform:scale(.98)}button:disabled{cursor:not-allowed;opacity:.42}.primary{color:#fff;background:var(--blue)}.primary:hover{background:var(--blue2)}.secondary{color:#29405e;background:#edf3fc}.panel{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.qr{width:260px;height:260px;display:grid;place-items:center}.qr img,.qr canvas{max-width:100%;height:auto!important;border-radius:5px}.placeholder{text-align:center;color:#98a2b3;line-height:1.7}.panel-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.tip{margin:15px 0 0;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}.privacy{margin-top:20px;padding:15px;border-radius:12px;color:#6e5d35;background:#fff9e8;font-size:13px;line-height:1.65}@media(max-width:760px){body{padding:14px}.app{padding:20px}header{display:block}.tabs{margin-top:18px}.grid{grid-template-columns:1fr}textarea{min-height:210px}.panel{min-height:auto}}
header{display:block}.tabs{display:none}.tool[hidden]{display:block}.tool+.tool{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.app{padding:22px}header{margin-bottom:18px}h1{font-size:clamp(26px,4vw,36px)}.tool-title{margin-bottom:14px;padding:10px 14px}.grid{gap:18px;grid-template-columns:minmax(0,1fr) 280px}textarea{min-height:136px;height:136px}.proxy-input{min-height:112px;height:112px}.meta{margin-top:6px}.buttons{margin-top:10px}.privacy{margin-top:12px;padding:11px}.panel{min-height:300px;padding:14px}.qr{width:220px;height:220px}.panel-actions{margin-top:12px}.tip{margin-top:10px} @media(max-width:760px){textarea{min-height:136px;height:136px}.proxy-input{min-height:112px;height:112px}.panel{min-height:280px}.qr{width:210px;height:210px}}
</style></head><body><main class="app"><header><div><h1>二维码工具箱</h1><p class="lead">文本传到手机，或生成小火箭代理二维码。</p></div></header>
<section id="textTool" class="tool"><p class="tool-title">输入四行内容，iPhone 扫码后可复制账号、密码、邮箱，并打开第四行网址。</p><div class="grid"><section><label for="text">文本内容</label><textarea id="text" placeholder="第一行：账号&#10;第二行：密码&#10;第三行：邮箱&#10;第四行：网址" autofocus></textarea><div class="meta"><span id="textStatus" class="status">等待输入</span><span id="count">0 字符 · 0 字节</span></div></section><section class="panel"><div id="textQr" class="qr"><div class="placeholder">二维码会显示在这里</div></div><div class="panel-actions"><button id="copyText" class="secondary" disabled>复制文本</button><button id="downloadText" class="primary" disabled>下载二维码</button></div><p class="tip">扫码链接可在任意网络打开，文本不会作为网页请求发送到服务器。</p></section></div></section>
<section id="proxyTool" class="tool" hidden><p class="tool-title">粘贴完整的 SOCKS5 代理链接，生成后使用 Shadowrocket 扫码导入。</p><div class="grid"><section><label for="proxy">代理链接</label><textarea id="proxy" class="proxy-input" spellcheck="false" autocomplete="off" placeholder="socks5://用户名:密码@服务器:端口"></textarea><div class="meta"><span id="proxyStatus" class="status">等待输入</span></div><div class="buttons"><button id="generateProxy" class="primary">生成二维码</button><button id="clearProxy" class="secondary">清空</button></div><div class="privacy">二维码包含代理账号和密码，请勿公开发送或上传；不再使用时建议及时清空页面。</div></section><section class="panel"><div id="proxyQr" class="qr"><div class="placeholder">二维码会显示在这里</div></div><div class="panel-actions"><button id="downloadProxy" class="primary" disabled>下载二维码</button></div><p class="tip">代理内容只在当前浏览器中处理。</p></section></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const $=s=>document.querySelector(s);let timer;document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.tool').forEach(x=>x.hidden=x.id!==tab.dataset.tool)});function draw(box,value,size=260){box.replaceChildren();new QRCode(box,{text:value,width:size,height:size,colorDark:'#111827',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}function downloadQr(box,name){const canvas=box.querySelector('canvas'),img=box.querySelector('img'),url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url)return;const a=document.createElement('a');a.href=url;a.download=name;a.click()}
const text=$('#text'),textQr=$('#textQr'),textStatus=$('#textStatus'),count=$('#count'),copyText=$('#copyText'),downloadText=$('#downloadText');function updateText(){const value=text.value,bytes=new TextEncoder().encode(value).length;count.textContent=`${value.length} 字符 · ${bytes} 字节`;textQr.innerHTML='';copyText.disabled=downloadText.disabled=!value;if(!value){textQr.innerHTML='<div class="placeholder">二维码会显示在这里</div>';textStatus.textContent='等待输入';textStatus.className='status';return}if(!window.QRCode){textStatus.textContent='二维码组件加载失败，请刷新页面';textStatus.className='status error';return}try{if(location.protocol==='file:')throw new Error('online');const data=new TextEncoder().encode(value);let binary='';data.forEach(b=>binary+=String.fromCharCode(b));const encoded=btoa(binary).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');const viewer=new URL('view.html',location.href);viewer.hash=encoded;draw(textQr,viewer.href);textStatus.textContent=bytes>1200?'内容较长，请实际扫码确认':'已生成';textStatus.className='status success'}catch(error){textQr.innerHTML=`<div class="placeholder">${error.message==='online'?'请使用 GitHub 在线地址':'内容太长，无法放入二维码'}</div>`;textStatus.textContent=error.message==='online'?'本地文件不能生成手机访问链接':'内容超过二维码容量';textStatus.className='status error';downloadText.disabled=true}}text.oninput=()=>{clearTimeout(timer);timer=setTimeout(updateText,180)};copyText.onclick=async()=>{await navigator.clipboard.writeText(text.value);copyText.textContent='已复制';setTimeout(()=>copyText.textContent='复制文本',1200)};downloadText.onclick=()=>downloadQr(textQr,'文本二维码.png');
const proxy=$('#proxy'),proxyQr=$('#proxyQr'),proxyStatus=$('#proxyStatus'),downloadProxy=$('#downloadProxy');function proxyError(value){if(!value)return'请先粘贴代理链接';if(!/^(socks5|socks):\/\//i.test(value))return'链接需要以 socks5:// 或 socks:// 开头';if(/\s/.test(value))return'链接中不能包含空格或换行';try{const u=new URL(value);if(!u.hostname||!u.port)return'代理链接缺少服务器地址或端口'}catch(_){return'代理链接格式不正确'}return''}$('#generateProxy').onclick=()=>{const value=proxy.value.trim(),error=proxyError(value);if(error){proxyStatus.textContent=error;proxyStatus.className='status error';downloadProxy.disabled=true;return}try{draw(proxyQr,value);proxyStatus.textContent='已生成，可用 Shadowrocket 扫码导入';proxyStatus.className='status success';downloadProxy.disabled=false}catch(_){proxyStatus.textContent='内容过长，无法生成二维码';proxyStatus.className='status error';downloadProxy.disabled=true}};$('#clearProxy').onclick=()=>{proxy.value='';proxyQr.innerHTML='<div class="placeholder">二维码会显示在这里</div>';proxyStatus.textContent='等待输入';proxyStatus.className='status';downloadProxy.disabled=true;proxy.focus()};downloadProxy.onclick=()=>downloadQr(proxyQr,`shadowrocket-proxy-${Date.now()}.png`);proxy.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('#generateProxy').click()};
</script><script>
document.querySelector('#proxyTool .tool-title').textContent='支持 socks5:// 链接，也支持“服务器:端口:用户名:密码”格式，生成后使用 Shadowrocket 扫码导入。';
proxy.placeholder='服务器:端口:用户名:密码\n或 socks5://用户名:密码@服务器:端口';
function normalizeProxyInput(raw){
  const value=raw.trim();
  if(!value)return{error:'请先粘贴代理信息'};
  if(/\s/.test(value))return{error:'代理信息中不能包含空格或换行'};
  if(/^(socks5|socks):\/\//i.test(value)){
    try{const u=new URL(value);if(!u.hostname||!u.port)return{error:'代理链接缺少服务器地址或端口'};return{url:value,converted:false}}catch(_){return{error:'代理链接格式不正确'}}
  }
  const match=value.match(/^([^:\s]+):(\d{1,5}):([^:\s]+):(.+)$/);
  if(!match)return{error:'请输入“服务器:端口:用户名:密码”格式'};
  const[,host,port,user,password]=match;
  if(Number(port)<1||Number(port)>65535)return{error:'端口需要在 1 到 65535 之间'};
  return{url:`socks5://${encodeURIComponent(user)}:${encodeURIComponent(password)}@${host}:${port}`,converted:true};
}
document.querySelector('#generateProxy').onclick=()=>{
  const result=normalizeProxyInput(proxy.value);
  if(result.error){proxyStatus.textContent=result.error;proxyStatus.className='status error';downloadProxy.disabled=true;return}
  try{draw(proxyQr,result.url);proxyStatus.textContent=result.converted?'已自动转换并生成，可用 Shadowrocket 扫码导入':'已生成，可用 Shadowrocket 扫码导入';proxyStatus.className='status success';downloadProxy.disabled=false}catch(_){proxyStatus.textContent='内容过长，无法生成二维码';proxyStatus.className='status error';downloadProxy.disabled=true}
};
</script></body></html>
