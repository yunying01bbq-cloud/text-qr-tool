<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>扫码文本</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#f3f7fd;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{width:min(680px,100%);padding:24px;border-radius:22px;background:#fff;box-shadow:0 18px 60px #294a7520} h1{margin:0 0 16px;font-size:27px}
    pre{margin:0;min-height:180px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #dfe6f0;border-radius:14px;background:#f9fbfe;font:17px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;user-select:text}
    button{width:100%;height:50px;margin-top:16px;border:0;border-radius:13px;color:#fff;background:#1677ff;font-size:17px;font-weight:650} p{margin:14px 0 0;text-align:center;color:#718096;font-size:13px}
  </style>
</head>
<body>
  <main><h1>文本内容</h1><pre id="content"></pre><button id="copy">复制全部文本</button><p>内容来自二维码，可长按上方文字选择复制。</p></main>
  <script>
    const encoded = location.hash.slice(1).replaceAll('-', '+').replaceAll('_', '/');
    let value = '';
    try {
      const binary = atob(encoded + '='.repeat((4 - encoded.length % 4) % 4));
      value = new TextDecoder().decode(Uint8Array.from(binary, c => c.charCodeAt(0)));
    } catch (_) { value = '二维码内容无法读取'; }
    document.querySelector('#content').textContent = value;
    document.querySelector('#copy').onclick = async function () {
      await navigator.clipboard.writeText(value); this.textContent = '已复制';
      setTimeout(() => this.textContent = '复制全部文本', 1400);
    };
  </script>
</body>
</html>
